name: InvChest
version: '${project.version}'
main: cn.craftime.invchest.InvChest
authors: [OutHimic、TTOCServer]
description: 让容器里的物品自己流进玩家的口袋。
website: github.com/TTOCServer/
commands:
  invchest:
    description: InvChest main command
    aliases: [ic]
    usage: /invchest <bind|unbind|unbind-here|unbind-all|reload> [player]
    permission: invchest.bind
permissions:
  invchest.bind:
    description: Allows a player to bind/unbind a container
    default: true
  invchest.admin:
    description: Allows admin to bind/unbind for other players and bypass protection
    default: op
  invchest.reload:
    description: Allows reloading the plugin configuration
    default: op
